[package]
name = "som-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Somfic"]
description = "som command line interface"
rust-version = "1.90.0"

[lib]
name = "som_cli"
path = "src/lib.rs"

[[bin]]
name = "som"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
som_base = { path = "../../core/base" }
som_driver = { path = "../../driver" }
som_lsp = { path = "../lsp" }

[dev-dependencies]
tempfile = "3"
