[package]
name = "som_driver"
version = "0.1.0"
edition = "2024"
description = "Loads a program and runs the compiler passes over it, in order"

[dependencies]
serde_json = "1"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
som_base = { path = "../core/base" }
som_ast = { path = "../core/ast" }
som_lexer = { path = "../compiler/1-lexer" }
som_parser = { path = "../compiler/2-parser" }
som_resolve = { path = "../compiler/3-resolve" }
som_typeck = { path = "../compiler/4-typeck" }
som_lower = { path = "../compiler/5-lower" }
som_mir = { path = "../core/mir" }
som_borrowck = { path = "../compiler/6-borrowck" }
som_codegen = { path = "../compiler/7-codegen" }

[dev-dependencies]
tempfile = "3"
