[package]
name = "som_driver"
version = "0.1.0"
edition = "2024"
description = "Loads a program and runs the compiler passes over it, in order"

[dependencies]
som_lang = { path = "../core/lang" }
serde_json = "1"
object = { version = "0.36", default-features = false, features = [
    "read",
    "std",
] }
som_base = { path = "../core/base" }
som_ast = { path = "../core/ast" }
som_lexer = { path = "../compiler/1-lexer" }
som_parser = { path = "../compiler/2-parser" }
som_resolve = { path = "../compiler/3-resolve" }
som_typeck = { path = "../compiler/4-typeck" }
som_prove = { path = "../compiler/5-prove" }
som_lower = { path = "../compiler/6-lower" }
som_mir = { path = "../core/mir" }
som_borrowcheck = { path = "../compiler/7-borrowcheck" }
som_comptime = { path = "../compiler/8-comptime" }
som_optimize = { path = "../compiler/9-optimize" }
som_codegen = { path = "../compiler/10-codegen" }
som_shader = { path = "../compiler/shader" }

[dev-dependencies]
tempfile = "3"
