[workspace]
resolver = "3"
members = [
    # shared data
    "crates/core/base",
    "crates/core/ast",
    "crates/core/mir",
    "crates/core/lang",

    # the compiler passes, in pipeline order
    "crates/compiler/1-lexer",
    "crates/compiler/2-parser",
    "crates/compiler/3-resolve",
    "crates/compiler/4-typeck",
    "crates/compiler/5-prove",
    "crates/compiler/6-lower",
    "crates/compiler/7-borrowcheck",
    "crates/compiler/8-comptime",
    "crates/compiler/9-optimize",
    "crates/compiler/10-codegen",

    # orchestration
    "crates/driver",

    # tools
    "crates/tools/cli",
    "crates/tools/lsp",

    # the corpus of test programs and its runner
    "tests",
]
